# Waypoint keyword-to-URL map (maintained; content-ops owns this file)
# ---------------------------------------------------------------------
# One row per target URL. This is the routing table for what we write
# and where it lives — NOT a place for volume numbers or invented stats.
#
# Fields per entry:
#   primary_kw     — the one query the page must win (plausible parent phrasing)
#   secondary_kws  — supporting phrasings the same page should cover
#   intent         — info | tool | letter | local | comparison
#   url            — canonical path, leading + trailing slash
#   pillar         — regional-centers | iep | benefits | insurance | first-steps | start
#                    (must match PILLARS in src/content.config.ts)
#   priority       — P0 | P1 | P2
#   status         — planned | drafting | published
#                    ('published' here means live on site, i.e. it passed the
#                    D2 status ladder: draft → founder_edit → in_review →
#                    approved → published. Update this row when it ships.)
#   piece_no       — production order for the first-10 launch pieces (else null)
#   serp_notes     — free text: SERP observations, slug caveats, companions
#
# Rules:
#   - primary_kw and url must each be unique across the file
#     (enforced: node scripts/validate-keyword-map.mjs)
#   - Regional-center slugs must match RC_IDS in src/content.config.ts exactly
#   - No search-volume numbers in this file; if a claim needs data, it goes
#     in the piece itself with a citation or a [TBC] placeholder
#   - EN rows only for now; ES twins share the URL space under /es/ and will
#     be added as rows when the translation queue opens

