# Auto-deploys Supabase Edge Functions when they change on main —
# no more copy-pasting into the Supabase dashboard.
#
# One-time setup (required once, ~2 minutes):
#   1. Supabase dashboard → click your avatar (bottom-left) → Account Settings
#      → Access Tokens → "Generate new token" → copy it.
#   2. GitHub repo → Settings → Secrets and variables → Actions →
#      "New repository secret" → Name: SUPABASE_ACCESS_TOKEN → paste → save.
# After that, every merge touching waypoint-app/supabase/functions/** deploys
# automatically.

name: Deploy Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'waypoint-app/supabase/functions/**'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: waypoint-app
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # Project ref from the project URL (https://<ref>.supabase.co) — not a secret
      SUPABASE_PROJECT_ID: pltcmpephjkcncxmwbyw
    steps:
      - uses: actions/checkout@v5

      - name: Check for access token
        id: token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN secret is not set — skipping deploy. See the comment at the top of .github/workflows/deploy-edge-functions.yml for the one-time setup."
            echo "present=false" >> "$GITHUB_OUTPUT"
          elif [[ "$SUPABASE_ACCESS_TOKEN" != sbp_* ]]; then
            echo "::error::SUPABASE_ACCESS_TOKEN doesn't look like a personal access token (it should start with 'sbp_'). A project API key (anon/service_role, 'eyJ...') will NOT work here. Generate one at Supabase → avatar (bottom-left) → Account Settings → Access Tokens, then update the GitHub secret."
            exit 1
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.token.outputs.present == 'true'
        with:
          version: latest

      - name: Deploy ai-proxy
        if: steps.token.outputs.present == 'true'
        run: supabase functions deploy ai-proxy --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy delete-account
        if: steps.token.outputs.present == 'true'
        run: supabase functions deploy delete-account --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy google-auth
        if: steps.token.outputs.present == 'true'
        run: supabase functions deploy google-auth --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy gmail
        if: steps.token.outputs.present == 'true'
        run: supabase functions deploy gmail --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy stripe-webhook
        if: steps.token.outputs.present == 'true'
        # verify_jwt=false comes from supabase/config.toml — Stripe can't send
        # a Supabase JWT; the function verifies the Stripe-Signature HMAC.
        run: supabase functions deploy stripe-webhook --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy push-send
        if: steps.token.outputs.present == 'true'
        # verify_jwt=false (config.toml) — auth is the OUTBOUND_CRON_SECRET
        # shared secret. Reads _shared/replyPush.ts + _shared/pushSend.ts.
        run: supabase functions deploy push-send --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy poll-replies
        if: steps.token.outputs.present == 'true'
        # verify_jwt=false (config.toml) — the pg_cron/pg_net entry. Reads
        # _shared/gmailSync.ts + _shared/pushSend.ts.
        run: supabase functions deploy poll-replies --project-ref "$SUPABASE_PROJECT_ID"
