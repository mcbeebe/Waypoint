name: Deploy to GitHub Pages

# Publishes docs/ (the Supabase-backed web MVP — docs/ here is a deploy
# directory, NOT documentation) to GitHub Pages.
#
# The automatic trigger was `push: branches: [dev]`. There is no `dev` branch
# in this repo and there is no evidence there ever was one, so that trigger
# had never fired: every deploy of this site has been a manual dispatch, and
# the workflow silently implied otherwise.
#
# Rather than repoint it at `main` — which would start auto-publishing a
# directory nobody has deployed automatically before, without knowing whether
# its current contents are release-ready — the dead trigger is removed and
# this stays explicitly manual. Repointing it at `main` is a decision for the
# owner, not a side effect of a cleanup.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
