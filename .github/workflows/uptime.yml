name: live-site monitor

# Launch-checklist row 20 (uptime + SSL), and a standing guard on rows 4, 5
# and 12 — the app's noindex header, answer-engine access, and the marketing
# robots.txt/sitemap. Those three are BLOCKERS that pass once at launch and
# can silently regress afterwards with no visible symptom.
#
# Deliberately every 2 hours, not every 5 minutes. This is a configuration
# monitor, not an outage pager: a short outage will slip past it, and a real
# pinger (a free UptimeRobot/BetterStack check on the apex) is still the
# right complement — that one needs an account, which is Mike's to create.
# Two-hourly is enough to catch a header, robots, sitemap, or certificate
# regression the same day it happens, at ~3 minutes of Actions time a day.
#
# Alerting is a GitHub issue rather than a webhook: it needs no new account
# or secret, it emails the repo owner on open, and it de-duplicates itself
# so a multi-day outage is one thread instead of 36 notifications.

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: live-site-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check the live site
        id: check
        working-directory: waypoint-site
        run: |
          set +e
          node scripts/uptime-check.mjs 2>&1 | tee /tmp/monitor.log
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        run: |
          {
            echo '## Live-site monitor'
            echo '```'
            cat /tmp/monitor.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # One open issue at a time. A new failure opens it; a repeat failure
      # comments on the existing thread; recovery closes it. Anything else
      # turns a bad afternoon into an inbox full of duplicates.
      - name: Raise or update the alert
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED: ${{ steps.check.outputs.status }}
          TITLE: 'Live-site monitor: waypointchild.com check failing'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          EXISTING=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title \
            --jq "[.[] | select(.title == \"$TITLE\")] | .[0].number // empty")

          if [ "${FAILED}" != "0" ]; then
            BODY=$(printf '%s\n\n```\n%s\n```\n\n[Run log](%s)\n' \
              "The live-site monitor failed. This checks the things that break silently: the app host's noindex header, answer-engine access, robots.txt, the sitemap, the www redirect, and certificate expiry." \
              "$(cat /tmp/monitor.log)" "$RUN_URL")
            if [ -n "$EXISTING" ]; then
              gh issue comment "$EXISTING" --body "$BODY"
            else
              gh issue create --title "$TITLE" --body "$BODY" --label "" || \
                gh issue create --title "$TITLE" --body "$BODY"
            fi
            exit 1
          fi

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Recovered — the monitor passed at $RUN_URL. Closing."
            gh issue close "$EXISTING"
          fi
