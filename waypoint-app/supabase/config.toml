# Minimal Supabase CLI config — enables `supabase functions deploy`
# (used by .github/workflows/deploy-edge-functions.yml).
project_id = "waypoint-app"

[functions.ai-proxy]
# Callers must present a Supabase JWT (the app sends the user's session token)
verify_jwt = true

[functions.gmail]
# Standard user-JWT auth; the Google refresh token is read via RLS.
verify_jwt = true

[functions.stripe-webhook]
# Stripe calls this endpoint directly and cannot present a Supabase JWT —
# authenticity is proven by the Stripe-Signature HMAC check inside the
# function instead. Do not flip this to true or webhooks silently 401.
verify_jwt = false

[functions.push-send]
# The reply-push sender (phase 7 Lane B). Called by the cron poller and by the
# owner to test — neither presents a Supabase JWT. Authenticity is the
# OUTBOUND_CRON_SECRET shared secret checked inside the function. Do not flip to
# true or the cron call silently 401s.
verify_jwt = false

[functions.poll-replies]
# The app-closed cron entry (phase 7 Lane B). pg_cron → pg_net posts here with
# no JWT; the OUTBOUND_CRON_SECRET shared secret is the auth. Do not flip true.
verify_jwt = false

[functions.family-invite]
# Family Sharing B2: emails a co-parent their join link (Resend). Standard
# user-JWT auth; authorization is RLS (055) — the invitation is read with the
# caller's own token, so only the family's owner/admin gets the row.
verify_jwt = true
