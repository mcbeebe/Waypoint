<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, interactive-widget=resizes-content"
    />
    <!--
      `interactive-widget=resizes-content` (WICG Virtual Keyboard API, Safari
      17.4+ / Chrome 108+): without it, focusing a TextInput on a phone
      browser shrinks the VISUAL viewport for the on-screen keyboard but
      leaves the LAYOUT viewport (and this app's `height: 100%` / `#root`
      flex column below) unchanged. The browser's own "scroll the focused
      input into view" then scrolls that unchanged layout against a display
      area it no longer matches, painting the old scroll position behind the
      new one — the composer "jumps" and shows a ghosted double image of the
      screen (reported 2026-09-12, screen: Navigator/Learn search bar). This
      tells the browser to resize layout together with the keyboard instead,
      so there is nothing stale left to paint behind.
    -->
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
